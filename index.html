<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Experience Digit Recognition</title>
  <style>
    :root {
      --paper: #fbfaf6;
      --sunk: #f4f2ea;
      --ink: #16150f;
      --muted: #6f6b61;
      --rule: #e2ded2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 17px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    a { color: inherit; }
    .wrap { width: 100%; max-width: 824px; margin: 0 auto; padding: 0 32px; }
    main { flex: 1; padding: 32px 0 28px; }
    /* desktop: narrow the column so title, canvas, credits and footer fit the window height (310px = everything but the canvas) */
    main .wrap { container-type: inline-size; max-width: clamp(424px, calc((100vh - 310px) * 760 / 846 + 64px), 824px); }
    h1 {
      font-size: clamp(23.5px, 4.41cqi, 33.5px);
      line-height: 1.1;
      letter-spacing: -0.03em;
      font-weight: 600;
      text-align: center;
      margin: 0 0 16px;
    }
    #net {
      display: block;
      width: 100%;
      aspect-ratio: 760 / 846;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;  /* no grey flash over the whole canvas on each tap */
      cursor: crosshair;
    }
    /* centred under the drawing pad (x 50-344 of the 760-wide canvas), in the space below it */
    .controls { position: relative; width: calc(294 / 760 * 100%); margin: calc(-40 / 760 * 100%) 0 0 calc(50 / 760 * 100%); text-align: center; }
    button {
      font: 550 14px ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      padding: 5px 18px;
      border: 1.5px solid var(--ink);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
    }
    button:hover { background: var(--sunk); }
    .credits {
      margin: 24px 0 0;
      padding-top: 16px;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 14.5px;
    }
    footer { position: sticky; bottom: 0; z-index: 10; background: var(--ink); color: var(--paper); }
    footer .wrap {
      padding-top: 16px;
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      gap: 10px 24px;
      flex-wrap: wrap;
      font-size: 14.5px;
    }
    footer a { color: var(--paper); text-decoration: none; }
    footer a:hover { opacity: .75; }
    footer ul { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; flex-wrap: wrap; }
    footer strong { font-weight: 650; }
    @media (max-width: 720px) {
      .wrap { padding: 0 16px; }
      main .wrap { max-width: none; }
      main { padding: 20px 0 20px; }
      h1 { margin-bottom: 12px; }
      footer .wrap { padding-bottom: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="wrap">
      <h1>Experience Digit Recognition from the Neural Network Perspective</h1>
      <canvas id="net"></canvas>
      <div class="controls">
        <button id="clear">Clear</button>
      </div>
      <p class="credits">
        A small convolutional network, 99% accurate on MNIST, running live in your browser.
        Weights: <a href="https://github.com/onnx/models/tree/main/validated/vision/classification/mnist">ONNX Model Zoo</a> (MIT).
        Inspired by Brilliant.org.
      </p>
    </div>
  </main>
  <footer>
    <div class="wrap">
      <span>Built by <strong>Evgeni&nbsp;Hasin</strong></span>
      <ul>
        <li><a href="https://github.com/ehasin/Visual-Digit-Recognition-CNN-in-action">Source on GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/evgenihasin/">LinkedIn</a></li>
      </ul>
    </div>
  </footer>
  <script src="preprocess.js"></script>
  <script src="cnn.js"></script>
  <script src="app.js"></script>
  <!-- Vercel Web Analytics (no cookies); the script only exists on the live site -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
