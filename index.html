<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Experience Digit Recognition</title>
  <style>
    :root {
      --paper: #fbfaf6;
      --sunk: #f4f2ea;
      --ink: #16150f;
      --muted: #6f6b61;
      --rule: #e2ded2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 17px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    a { color: inherit; }
    .wrap { width: 100%; max-width: 824px; margin: 0 auto; padding: 0 32px; }
    main { flex: 1; padding: 48px 0 40px; }
    h1 {
      font-size: clamp(28px, 5.4vw, 40px);
      line-height: 1.1;
      letter-spacing: -0.03em;
      font-weight: 600;
      margin: 0 0 28px;
    }
    #net {
      display: block;
      width: 100%;
      aspect-ratio: 760 / 900;
      touch-action: none;
      user-select: none;
      cursor: crosshair;
    }
    .controls { margin-top: 12px; }
    button {
      font: 550 15.5px ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      padding: 9px 24px;
      border: 1.5px solid var(--ink);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
    }
    button:hover { background: var(--sunk); }
    .credits {
      margin: 36px 0 0;
      padding-top: 20px;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 14.5px;
    }
    footer { background: var(--ink); color: var(--paper); }
    footer .wrap {
      padding-top: 16px;
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      gap: 10px 24px;
      flex-wrap: wrap;
      font-size: 14.5px;
    }
    footer a { color: var(--paper); text-decoration: none; }
    footer a:hover { opacity: .75; }
    footer ul { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; flex-wrap: wrap; }
    footer strong { font-weight: 650; }
    @media (max-width: 720px) {
      .wrap { padding: 0 16px; }
      main { padding: 28px 0 32px; }
      h1 { margin-bottom: 20px; }
      footer .wrap { padding-bottom: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="wrap">
      <h1>Experience Digit Recognition from the Neural Network Perspective</h1>
      <canvas id="net"></canvas>
      <div class="controls">
        <button id="clear">Clear</button>
      </div>
      <p class="credits">
        A small convolutional network, 99% accurate on MNIST, running live in your browser.
        Weights: <a href="https://github.com/onnx/models/tree/main/validated/vision/classification/mnist">ONNX Model Zoo</a> (MIT).
        Inspired by Brilliant.org.
      </p>
    </div>
  </main>
  <footer>
    <div class="wrap">
      <span>Built by <strong>Evgeni&nbsp;Hasin</strong></span>
      <ul>
        <li><a href="https://github.com/ehasin/Visual-Digit-Recognition-CNN-in-action">Source on GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/evgenihasin/">LinkedIn</a></li>
      </ul>
    </div>
  </footer>
  <script src="preprocess.js"></script>
  <script src="cnn.js"></script>
  <script src="app.js"></script>
</body>
</html>
